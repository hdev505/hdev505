<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="hdev505 animated banner">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090d"/>
      <stop offset="55%" stop-color="#0d1118"/>
      <stop offset="100%" stop-color="#121017"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b7355"/>
      <stop offset="50%" stop-color="#e2c57a"/>
      <stop offset="100%" stop-color="#8b7355"/>
      <animate attributeName="x1" values="0%;100%;0%" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="100%;200%;100%" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#c9a962" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#c9a962" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#c9a962" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <ellipse cx="600" cy="120" rx="420" ry="140" fill="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="5s" repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#c9a962" stroke-opacity="0.05" stroke-width="1">
    <path d="M0 64 H1200 M0 128 H1200 M0 192 H1200 M0 256 H1200"/>
    <path d="M150 0 V320 M300 0 V320 M450 0 V320 M600 0 V320 M750 0 V320 M900 0 V320 M1050 0 V320"/>
  </g>

  <g transform="translate(600 150)">
    <ellipse cx="0" cy="0" rx="210" ry="70" fill="none" stroke="#c9a962" stroke-opacity="0.18" stroke-width="1.2"/>
    <ellipse cx="0" cy="0" rx="210" ry="70" fill="none" stroke="#e2c57a" stroke-opacity="0.45" stroke-width="1.5" stroke-dasharray="6 180">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="0" cy="0" rx="260" ry="95" fill="none" stroke="#8b7355" stroke-opacity="0.2" stroke-width="1" stroke-dasharray="4 120">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="22s" repeatCount="indefinite"/>
    </ellipse>
  </g>

  <g fill="#e2c57a">
    <circle cx="180" cy="70" r="2.2" opacity="0.7">
      <animate attributeName="cy" values="70;50;70" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.9;0.3" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="90" r="1.8" opacity="0.6">
      <animate attributeName="cy" values="90;65;90" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="240" cy="230" r="1.6" opacity="0.5">
      <animate attributeName="cy" values="230;210;230" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="920" cy="220" r="2" opacity="0.65">
      <animate attributeName="cy" values="220;195;220" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="520" cy="60" r="1.4" opacity="0.55">
      <animate attributeName="opacity" values="0.2;0.85;0.2" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="250" r="1.7" opacity="0.5">
      <animate attributeName="cy" values="250;235;250" dur="6.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="-220" y="0" width="180" height="320" fill="url(#sweep)" opacity="0.9">
    <animate attributeName="x" values="-220;1220" dur="7s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="128" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="54" font-weight="600" fill="url(#gold)" letter-spacing="6">HONEST</text>
  <text x="600" y="168" text-anchor="middle" font-family="Georgia, Times New Roman, serif" font-size="20" fill="#c9a962" opacity="0.85" letter-spacing="8">hdev505</text>
  <text x="600" y="210" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" fill="#9aa1ad" letter-spacing="2">SENIOR SOFTWARE ENGINEER  |  FULL-STACK CRAFT</text>

  <rect x="430" y="228" width="340" height="1.5" rx="1" fill="url(#gold)" opacity="0.85">
    <animate attributeName="width" values="120;340;120" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x" values="540;430;540" dur="5s" repeatCount="indefinite"/>
  </rect>
</svg>
